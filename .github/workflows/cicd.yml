name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build and test with Maven
        run: mvn -B clean package

      - name: Save JAR for next stage
        uses: actions/upload-artifact@v6
        with:
          name: app-jar
          path: target/maven-cicd-demo.jar
          if-no-files-found: error
          retention-days: 3

  docker-pipeline:
    name: Docker Build, Test & Deploy
    needs: build-test
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download JAR from build stage
        uses: actions/download-artifact@v7
        with:
          name: app-jar
          path: target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image locally
        run: |
          docker build -t maven-cicd-demo:test .

      - name: Test run container and verify HTTP endpoints
        run: |
          docker run -d --name test-app -p 8080:8080 maven-cicd-demo:test
          sleep 4
          echo "Testing /health endpoint..."
          curl -f http://localhost:8080/health
          echo -e "\nTesting / endpoint..."
          curl -f http://localhost:8080/
          echo -e "\nTesting /api/info endpoint..."
          curl -f http://localhost:8080/api/info
          echo -e "\nStopping test container..."
          docker stop test-app
          docker rm test-app

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKERHUB_USER != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Docker image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKERHUB_USER != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/maven-cicd-demo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/maven-cicd-demo:${{ github.sha }}

      - name: Verify published container from Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKERHUB_USER != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          docker pull "${{ secrets.DOCKERHUB_USERNAME }}/maven-cicd-demo:latest"
          docker run -d --name deployed-app -p 8080:8080 "${{ secrets.DOCKERHUB_USERNAME }}/maven-cicd-demo:latest"
          sleep 4
          curl -f http://localhost:8080/health
          docker stop deployed-app
          docker rm deployed-app

      - name: Pipeline Notice
        if: env.DOCKERHUB_USER == '' || env.DOCKERHUB_TOKEN == ''
        run: |
          echo "::notice ::Docker image built and verified locally on runner. To enable automated publishing to Docker Hub, add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to your repository secrets."
