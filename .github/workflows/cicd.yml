name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build and test with Maven
        run: mvn -B clean package

      - name: Save JAR for the next stage
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/maven-cicd-demo.jar
          if-no-files-found: error
          retention-days: 3

  docker-build:
    name: Build and Test Docker Container
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR from build stage
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally
        run: |
          docker build -t maven-cicd-demo:test .

      - name: Verify container execution
        run: |
          output=$(docker run --rm maven-cicd-demo:test)
          echo "Container Output: $output"
          test "$output" = "Hello World!"

      - name: Check for Docker Hub Secrets
        id: docker_auth
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USER" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "has_auth=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials detected. Publishing to Docker Hub..."
          else
            echo "has_auth=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::Docker Hub credentials (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN) are not set. Pushing to Docker Hub was skipped; container built and verified locally on runner."
          fi

      - name: Log in to Docker Hub
        if: steps.docker_auth.outputs.has_auth == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.docker_auth.outputs.has_auth == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/maven-cicd-demo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/maven-cicd-demo:${{ github.sha }}

  deploy:
    name: Deploy (Pull and Verify Published Container)
    needs: docker-build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull the published image
        run: docker pull "${{ secrets.DOCKERHUB_USERNAME }}/maven-cicd-demo:latest"

      - name: Run the published container and verify output
        run: |
          output=$(docker run --rm "${{ secrets.DOCKERHUB_USERNAME }}/maven-cicd-demo:latest")
          echo "$output"
          test "$output" = "Hello World!"
